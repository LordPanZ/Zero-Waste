<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Zero Waste</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct load of a route like
      // /Zero-Waste/despensa hits this 404 page. Redirect back to index.html, encoding
      // the intended path in the query string so index.html's own script (see below)
      // can restore it via history.replaceState before the app mounts.
      // Adapted from https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // "/Zero-Waste"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
